[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mana-hand-simulator"
version = "0.2.0"
description = "Configurable Monte Carlo simulator for Commander opening hands and mulligans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.40",
    "streamlit-aggrid>=1.0.5",
]

[project.scripts]
mana-hand-simulator = "mana_hand_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
